name: Idea
description: Something Casterr could do better.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What gets in your way today, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea, if you have one. Simpler is better.
